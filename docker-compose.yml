services:
  auth_postgres:
    image: postgres:15-alpine
    container_name: starva_auth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_redis:
    image: redis:7-alpine
    container_name: starva_auth_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - auth_redis_data:/data

volumes:
  auth_pgdata:
  auth_redis_data: